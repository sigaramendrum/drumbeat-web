# Security scanning — drumbeat-web, the public landing site. Hand-written static HTML: no
# build step, no package.json, no lockfile, no container. The only meaningful risk class is
# a leaked secret, and this is the worst place in the project to leak one, because anything
# pushed here is world-readable immediately, history included. SAST, dependency and container
# scanning would be dead config and are deliberately omitted — add them if a package.json or
# a Dockerfile ever lands.
#
# ACTION PINNING: `uses:` is pinned to a full commit SHA, with the tag in a trailing comment.
# A mutable tag can be repointed by the action's owner, or by anyone who compromises that
# account, and the workflow would execute whatever it now points at.
#
# The gitleaks binary is downloaded rather than run as an action, so it gets the same
# treatment: an exact version, and the published SHA-256 verified BEFORE the binary executes.
# An unverified `curl` piped into a shell is the same trust problem as a mutable tag.
#
# THE SCANNER PIN IS MANUAL. Dependabot reads `uses:` references; it does not parse `run:`
# blocks, so nothing here or anywhere else will ever bump GITLEAKS_VERSION / GITLEAKS_SHA256.
# Bump both by hand: take the version and its matching linux_x64 line from that release's
# checksums.txt. Left alone, this scanner's ruleset freezes at the version below.
#
# WHAT THIS JOB CANNOT PROTECT AGAINST. On a pull request, both `.gitleaks.toml` and this
# workflow file come from the branch being scanned, so a pull request can weaken or disable
# its own scan. That was proven, not assumed: appending a global path allowlist to
# `.gitleaks.toml` alongside a live key produced "no leaks found", exit 0. No arrangement of
# flags inside a workflow can fix it. It is closed by branch protection plus required review
# on `.github/**` and `.gitleaks.toml`, which is tracked separately.
name: security
on:
  pull_request:
  # Deliberately unfiltered — NOT `branches: [main]`. Every ref pushed to a public repo is
  # world-readable the instant it lands, whether or not a pull request is ever opened.
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # all history for all refs, so a secret in an old commit is caught

      - name: install gitleaks (version + checksum pinned)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          # --fail so a 404 is reported as a download failure. Without it curl writes the
          # error body to the file and exits 0, and the operator sees a checksum mismatch —
          # which reads as tampering rather than a bad URL.
          curl --fail -sSLo "${RUNNER_TEMP}/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum -c -
          # Extract outside the checkout: a 21 MB binary sitting in the repo root would be
          # scanned by any future `gitleaks dir` run.
          tar -xzf "${RUNNER_TEMP}/gitleaks.tar.gz" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" version

      - name: gitleaks scan (all refs, full history, merge commits included)
        # --log-opts REPLACES gitleaks' own defaults rather than extending them. Passing
        # "-m" alone drops --all and --full-history, and a secret on a branch other than the
        # checked-out one goes from caught to missed — verified both ways before this was
        # written. All three flags must stay together.
        #
        #   -m   diff merge commits. Without it, content introduced ONLY in a merge commit
        #        is never scanned: `git log -p` emits no diff for a merge. GitHub's web
        #        conflict editor writes exactly that commit, server-side, where no local
        #        hook exists. Verified: a live AWS key added in a merge commit scanned clean
        #        at exit 0 without -m, and was caught with it.
        #
        #   --ignore-gitleaks-allow  otherwise a `# gitleaks:allow` comment on the same line
        #        silences the scanner from inside the very diff being scanned. Verified: a
        #        live key carrying that comment passed at exit 0.
        run: |
          "${RUNNER_TEMP}/gitleaks" git \
            --no-banner --redact --ignore-gitleaks-allow \
            --log-opts="-m --all --full-history" \
            -c .gitleaks.toml .

      - name: gitleaks scan (file types the default config exempts)
        # Runs even if the scan above failed, so one red step does not hide the other.
        if: always()
        # The scan above cannot see certain files at all. gitleaks' default config, inherited
        # through `useDefault = true`, carries a global allowlist that exempts whole classes
        # from EVERY rule. Measured against 8.30.1 with a live-format AWS key:
        #
        #   by extension : .svg .gltf .png .jpg .bmp .gif .tiff .pdf .docx .xlsx
        #                  .eot .ttf .otf .woff .woff2 .bin .exe .dll .pdb
        #   by FILENAME  : package-lock.json  yarn.lock  pnpm-lock.yaml  deno.lock
        #                  npm-shrinkwrap.json  Pipfile.lock  poetry.lock
        #                  gradle.lockfile  go.sum
        #
        # The filename group is the easy one to miss — an extension sweep does not find it —
        # and lockfiles are plain text that routinely carry registry credentials in resolved
        # URLs. Cargo.lock, composer.lock and uv.lock are NOT exempt, so it is an arbitrary
        # subset rather than a rule you can reason about.
        #
        # The exemption cannot be switched off. Allowlists are additive, so one declared in
        # our config appends to the inherited default instead of replacing it; `paths = []` is
        # rejected as a config error; there is no flag or subcommand to disable or dump the
        # default. All three were tried. So the exempt-but-textual files are copied to names
        # the allowlist does not match, and scanned as a second pass.
        #
        # DELIBERATELY NOT COVERED: .pdf, .docx, .xlsx and the binaries. gitleaks skips those
        # by content magic bytes, not only by extension — a file beginning %PDF- or PK\x03\x04
        # is skipped whatever it is named, verified with a planted key. Covering them needs
        # text extraction first, which is a different tool and a separate decision. Raster
        # images and fonts stay exempt because there is no text in them to match.
        #
        # TWO LIMITS, both real, neither fixed here:
        #   - This pass reads the tree at HEAD. The scan above reads all history on all refs.
        #     So a secret added and deleted within one push sits in public history and is seen
        #     by neither: the history scan is blind to the file type, this one to the deletion.
        #   - `paths` allowlists in .gitleaks.toml are matched against the FLATTENED temp path,
        #     not the repo path, so the obvious suppression for a false positive here will not
        #     work. Suppress by fingerprint in .gitleaksignore instead.
        #
        # The workaround depends on an absence: `.txt` not being exempt upstream. If that ever
        # changes this step reports success while scanning nothing, which is why it self-tests
        # below rather than trusting a green result.
        run: |
          set -euo pipefail
          base="${RUNNER_TEMP:?RUNNER_TEMP must be set}"
          gl="${base}/gitleaks"

          # ---- self-test -------------------------------------------------------------
          # This repo may track no exempt files at all, in which case the scan below is a
          # no-op forever and a broken pathspec, a missing binary or a changed upstream
          # allowlist would all look exactly like success. So prove the mechanism can still
          # go red, on every run, before trusting anything it says.
          #
          # The probe key is generated at runtime. A literal one in this file would be found
          # by the history scan three steps up, which is correct of it.
          probe="${base}/selftest"
          rm -rf "$probe"; mkdir -p "$probe/exempt" "$probe/renamed" "$probe/lockexempt" "$probe/lockrenamed"
          # Written in two halves so this workflow file does not itself contain a string
          # matching the AWS rule — the history scan two steps up would flag it, correctly.
          # The value is synthetic and has never been a credential.
          #
          # Two earlier attempts at generating one failed, both worth not repeating:
          # `tr -dc ... < /dev/urandom | head -c 16` makes head close the pipe, tr takes
          # SIGPIPE, and under `pipefail` the step died with 141 before testing anything.
          # A `printf '%016X'` random value is low-entropy hex, which the AWS rule does not
          # match at all — so the self-test failed while the mechanism was working.
          synthetic="AKIA""QYLPMN5HXQZ7TR4W"
          printf '<svg><title>aws_access_key_id = %s</title></svg>\n' "$synthetic" > "$probe/exempt/probe.svg"
          cp -- "$probe/exempt/probe.svg" "$probe/renamed/copy.scan.txt"

          # Probe the filename-matched class too, not just the extension-matched one. They are
          # two different mechanisms and only one of them was covered before.
          printf 'resolved: "https://r.example/x?_authToken=%s"\n' "$synthetic" > "$probe/lockexempt/pnpm-lock.yaml"
          cp -- "$probe/lockexempt/pnpm-lock.yaml" "$probe/lockrenamed/copy.scan.txt"

          set +e
          "$gl" dir --no-banner --redact -c .gitleaks.toml "$probe/exempt"       >/dev/null 2>&1; rc_exempt=$?
          "$gl" dir --no-banner --redact -c .gitleaks.toml "$probe/renamed"      >/dev/null 2>&1; rc_renamed=$?
          "$gl" dir --no-banner --redact -c .gitleaks.toml "$probe/lockexempt"   >/dev/null 2>&1; rc_lock_exempt=$?
          "$gl" dir --no-banner --redact -c .gitleaks.toml "$probe/lockrenamed"  >/dev/null 2>&1; rc_lock_renamed=$?
          set -e

          if [ "$rc_exempt" -ne 0 ]; then
            echo "SELF-TEST FAILED: .svg was expected to be skipped in place (exit 0), got $rc_exempt."
            echo "  Upstream may have dropped the exemption. If so this whole step is redundant"
            echo "  and should be deleted rather than left to rot."
            exit 1
          fi
          if [ "$rc_renamed" -ne 1 ]; then
            echo "SELF-TEST FAILED: the renamed copy was expected to be scanned and flagged (exit 1), got $rc_renamed."
            echo "  This step cannot detect anything in its current state. Do not trust a green result."
            exit 1
          fi
          if [ "$rc_lock_exempt" -ne 0 ]; then
            echo "SELF-TEST FAILED: a lockfile name was expected to be skipped in place (exit 0), got $rc_lock_exempt."
            exit 1
          fi
          if [ "$rc_lock_renamed" -ne 1 ]; then
            echo "SELF-TEST FAILED: the renamed lockfile copy was expected to be flagged (exit 1), got $rc_lock_renamed."
            echo "  Filename-matched exemptions are no longer being defeated by the copy. Coverage is gone."
            exit 1
          fi
          echo "Self-test passed: extension- and filename-matched exemptions both hold in place, and both are scanned once copied."

          # ---- scan the real tracked files -------------------------------------------
          shadow="${base}/exempt-scan"
          rm -rf "$shadow"; mkdir -p "$shadow"

          # Materialise the list to a file first. With `done < <(git ls-files ...)` the exit
          # status is discarded: `set -e` cannot see it and `pipefail` does not apply, so a
          # git failure produced zero files, a reassuring message and a GREEN step. Verified.
          list="${base}/exempt-list"
          git ls-files -z -- \
            ':(icase)*.svg' \
            ':(icase)*.gltf' \
            ':(icase)package-lock.json'   ':(icase)**/package-lock.json' \
            ':(icase)npm-shrinkwrap.json' ':(icase)**/npm-shrinkwrap.json' \
            ':(icase)yarn.lock'           ':(icase)**/yarn.lock' \
            ':(icase)pnpm-lock.yaml'      ':(icase)**/pnpm-lock.yaml' \
            ':(icase)deno.lock'           ':(icase)**/deno.lock' \
            ':(icase)Pipfile.lock'        ':(icase)**/Pipfile.lock' \
            ':(icase)poetry.lock'         ':(icase)**/poetry.lock' \
            ':(icase)gradle.lockfile'     ':(icase)**/gradle.lockfile' \
            ':(icase)go.sum'              ':(icase)**/go.sum' \
            > "$list"

          count=0
          while IFS= read -r -d '' f; do
            # One directory per file. Flattening the path with tr '/' '_' is NOT injective:
            # logo/icon.svg and logo_icon.svg both became logo_icon.svg.scan.txt, the second
            # cp silently overwrote the first, and the count still reported both. Verified.
            # `cp --` because a tracked file may legitimately begin with a dash.
            # OPAQUE destination name. Keeping the original basename leaves the exempt
            # filename in the copy, and whether that still matches depends on how upstream
            # anchors its pattern. Measured: a copy named pnpm-lock.yaml.scan.txt is caught
            # by 8.30.1 but still EXEMPT on 8.18.4, which is what a sibling repo pins. So the
            # lockfile coverage was working by luck of the current anchoring, not by design.
            # An opaque name is caught by both.
            mkdir -p "$shadow/$count"
            cp -- "$f" "$shadow/$count/copy.scan.txt"
            count=$((count + 1))
          done < "$list"

          if [ "$count" -eq 0 ]; then
            echo "No tracked files of an exempt type. Nothing further for this pass to scan."
            exit 0
          fi

          echo "Scanning $count file(s) that the default allowlist would otherwise skip:"
          git ls-files -- ':(icase)*.svg' ':(icase)*.gltf' | sed 's/^/  /'
          "$gl" dir --no-banner --redact --ignore-gitleaks-allow -c .gitleaks.toml "$shadow"
