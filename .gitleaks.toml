title = "drumbeat-web secret-scan baseline"

[extend]
useDefault = true

# WHY THIS RULE EXISTS.
#
# gitleaks' default ruleset has no rule for a connection string, so a URI carrying an inline
# password passes both the pre-commit hook and CI untouched. Measured against this file with
# `useDefault = true` alone before the rule was added: a real-format URI with an embedded
# password scanned clean, exit 0, "no leaks found". The default rules key off recognisable
# token shapes (AKIA..., ghp_..., sk-...), and a password has no shape.
#
# This repo holds no credentials today and is meant to keep it that way. The rule is here
# because the cheap moment to add it is before a URI reaches history, not after — and on a
# public repo "after" means rotating the credential, not deleting the line.
#
# REGEX DIALECT. gitleaks compiles rules with Go's RE2: no lookahead, no backreferences. A
# `(?!...)` does not degrade quietly, it panics and takes the whole scan down with it — which
# would turn the gate green-by-absence. Exclude placeholders with the allowlist below.
#
# Deliberately narrow: documenting a URI shape in a README must not turn CI red.

[[rules]]
id = "connection-uri-with-password"
description = "Connection URI with an inline password (Postgres, MySQL, MongoDB, Redis, AMQP)"
regex = '''(?i)\b(?:postgres(?:ql)?|mysql|mongodb(?:\+srv)?|rediss?|amqps?)://[a-z0-9._%+-]+:([^\s:@/'"`]{6,})@'''
secretGroup = 1
keywords = [
  "postgres://",
  "postgresql://",
  "mysql://",
  "mongodb://",
  "mongodb+srv://",
  "redis://",
  "rediss://",
  "amqp://",
  "amqps://",
]

  # Placeholder passwords only. If a real credential ever matches one of these, it was
  # already public. Stopwords match against the CAPTURED password (secretGroup 1), which
  # excludes the trailing '@' — so a stopword containing '@' would be an unreachable string.
  # The forms that need to match the surrounding URI are regexes, not stopwords, because a
  # bare stopword is a substring match and would also exempt a real password containing it.
  [rules.allowlist]
  regexTarget = "match"
  stopwords = [
    "password",
    "passwd",
    "changeme",
    "placeholder",
    "example",
    "redacted",
    "your-password",
    "your_password",
  ]
  regexes = [
    '''://postgres:postgres@''',
    '''://[a-z0-9._%+-]+:secret@''',
    '''://[a-z0-9._%+-]+:x{3,}@''',
    '''://[a-z0-9._%+-]+:\*{3,}@''',
    '''://[a-z0-9._%+-]+:<[^>]*>@''',
    '''://[a-z0-9._%+-]+:\$\{[^}]*\}@''',
    '''://[a-z0-9._%+-]+:\$[A-Za-z_][A-Za-z0-9_]*@''',
  ]

# WHY THIS RULE EXISTS.
#
# This repository is PUBLIC and its own README forbids strategy, IP, pilot and roadmap
# content. Internal decision-record identifiers are none of those things individually — an
# an identifier of that shape is not a secret — but together they map the decision structure
# and its phase numbering to anyone reading the landing site's source.
#
# It was not hypothetical. README.md named one, from this repo's first public commit
# (49f3e1e) until the commit that adds this rule. The identifier it named does not resolve
# to anything, so the string leaked structure without documenting even that.
#
# NOTE TO WHOEVER EDITS THIS FILE: do not write a literal example here. This file is
# EXEMPT from the scan by filename — verified, the same bytes renamed to .txt are flagged
# and in place they are not — so a literal in this comment is published and unguarded. The
# first draft of this rule made exactly that mistake, twice, in these lines.
#
# Deliberately narrow: two or three digits after ADR, so ordinary prose using the word
# "adr" does not match. A marketing site has no legitimate reason to name one.
#
# NOT COVERED: commit messages. gitleaks scans commit CONTENT, not messages — verified with
# a scratch repo whose only occurrence was in a message (exit 0). Commit 49f3e1e's subject
# still contains the string and always will; it is public, and rewriting published history
# would break every clone for no recovery. Treat it as disclosed.

[[rules]]
id = "internal-decision-record-identifier"
description = "Internal decision-record identifier must not appear in a public repository"
regex = '''(?i)\bADR[-‐‑–—_ ]?[0-9]{2,3}\b'''
keywords = ["adr"]

# Two more internal-reference classes, salvaged from the superseded ci/disclosure-guard
# branch. The ticket rule is clean over all history. The repository-name rule fires on four
# historical lines in 350e733 — those references were deliberately removed from the tree by
# a later commit whose subject is "stop leaking private detail in a public repo", so the
# current tree is clean and this rule guards the regression rather than an open wound. The
# four are fingerprinted in .gitleaksignore; they are public and cannot be unpublished.

[[rules]]
id = "internal-ticket-identifier"
description = "Internal issue-tracker identifier must not appear in a public repository"
regex = '''(?i)\bSIG[-‐‑–—_ ]?[0-9]{1,4}\b'''
keywords = ["sig"]

[[rules]]
id = "private-repository-name"
description = "Private repository name must not appear in a public repository"
# NO BARE SPACE in the separator class, unlike the two rules above, and no empty separator.
# This is the landing page for a product called Drumbeat, so "the Drumbeat app" is close to the
# most likely sentence its copy will ever contain — and with a space in the class the rule fired
# on exactly that, in CI and in the pre-commit hook:
#   "Drumbeat app for teams"          -> exit 1
#   "Download the Drumbeat App today" -> exit 1
# A repository name is written with a hyphen or an underscore. Prose is not.
regex = '''(?i)\bdrumbeat[-‐‑–—_]app\b'''
keywords = ["drumbeat"]
